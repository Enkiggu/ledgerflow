name: Core Domain CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify core domain invariants
        run: mvn --batch-mode --no-transfer-progress -Dtest=MoneyTest,OrderStateMachineTest,PaymentStateMachineTest,LedgerBalanceTest,RequestHasherTest test
